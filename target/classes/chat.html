<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 15px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .sent { align-self: flex-end; background-color: #0084ff; color: white; border-bottom-right-radius: 4px; }
        .received { align-self: flex-start; background-color: #e4e6eb; color: #050505; border-bottom-left-radius: 4px; }
        #input-container { padding: 15px; background: white; border-top: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .btn { border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .send-btn { background: #0084ff; color: white; }
        .voice-btn { background: #42b72a; color: white; }
        .voice-btn.recording { background: #fa3e3e; }
        .time { font-size: 10px; opacity: 0.7; margin-top: 4px; display: block; text-align: right; }
        audio { max-width: 100%; height: 35px; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Écrivez un message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="voice-btn" class="btn voice-btn" onclick="handleVoiceClick()">🎤</button>
        <button class="btn send-btn" onclick="sendMessage()">Envoyer</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const voiceBtn = document.getElementById('voice-btn');
        let knownIds = new Set();

        // Fonction appelée par Java pour ajouter un message
        function appendMessage(id, content, isSent, type, time) {
            if (knownIds.has(id)) return;
            knownIds.add(id);

            const div = document.createElement('div');
            div.className = `message ${isSent ? 'sent' : 'received'}`;
            
            if (type === 'voice') {
                div.innerHTML = `<audio controls src="${content}"></audio>`;
            } else {
                const textSpan = document.createElement('span');
                textSpan.textContent = content;
                div.appendChild(textSpan);
            }
            
            const timeSpan = document.createElement('span');
            timeSpan.className = 'time';
            timeSpan.textContent = time || new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            div.appendChild(timeSpan);

            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text && window.javaApp) {
                window.javaApp.sendText(text);
                messageInput.value = '';
            }
        }

        function handleVoiceClick() {
            if (window.javaApp) {
                window.javaApp.toggleVoice();
            }
        }

        function updateVoiceUI(isRecording) {
            if (isRecording) {
                voiceBtn.classList.add('recording');
                voiceBtn.textContent = '⏹';
            } else {
                voiceBtn.classList.remove('recording');
                voiceBtn.textContent = '🎤';
            }
        }

        function clearAll() {
            chatContainer.innerHTML = '';
            knownIds.clear();
        }
    </script>
</body>
</html>
